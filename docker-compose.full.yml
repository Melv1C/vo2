services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 10
    networks:
      - vo2-network

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: vo2-backend
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - 3000:3000
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/postgres
    networks:
      - vo2-network
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        - APP_ENV=development
    container_name: vo2-frontend
    depends_on:
      - backend
    ports:
      - 5173:80
    networks:
      - vo2-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  vo2-network:
    driver: bridge
