name: CI

on:
  pull_request:
    branches: [main]
  # For now, also run on push to main, but later push to main
  # will trigger a staging deployment workflow instead of CI.
  # And the staging deployment workflow will call this workflow as a reusable workflow.
  # workflow_call:
  push:
    branches: [main]

jobs:
  ci:
    name: Build & Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Varlock Generate
        run: bun run env:generate

      - name: Build all packages
        run: bun run build

      - name: Check (Format, Lint, Type Check)
        run: bun run check
